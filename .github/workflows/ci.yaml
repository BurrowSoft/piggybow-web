name: ci

# One run per pull-request push; nothing to install, so it takes seconds.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Checks
        run: node --test --test-reporter=spec test/build.test.mjs
      - name: Preview build (gated pages as drafts)
        run: node scripts/build.mjs
        env:
          SHOW_DRAFTS: '1'
