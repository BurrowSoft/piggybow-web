name: ci

# One run per pull-request push; nothing to install, so it takes seconds.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Actions are pinned to commit shas (a tag can move); the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Checks
        run: node --test --test-reporter=spec test/build.test.mjs
      - name: Preview build (gated pages as drafts)
        run: node scripts/build.mjs
        env:
          SHOW_DRAFTS: '1'
